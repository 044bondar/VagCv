server:
  port: 8080

spring:
  application:
    name: vagcv-garage
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/garage}
    username: ${DB_USER:garage}
    password: ${DB_PASSWORD:garage}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # схемою керує ТІЛЬКИ Liquibase
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  quartz:
    job-store-type: jdbc               # стан jobs/triggers у PostgreSQL (QRTZ_* таблиці), а не в пам'яті
    jdbc:
      initialize-schema: never         # схему QRTZ_* створює Liquibase (003-quartz-schema), не Spring
    overwrite-existing-jobs: true      # зміни у QuartzConfig перезаписують збережені в БД jobs
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: vagcv-scheduler
      org.quartz.threadPool.threadCount: "5"
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.useProperties: "false"
      org.quartz.jobStore.isClustered: "false"
      org.quartz.jobStore.misfireThreshold: "60000"   # 60 c: пізніше за це запуск вважається misfire
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: garage-ui
            client-secret: garage-ui-secret
            scope: openid,profile,email
            authorization-grant-type: authorization_code
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/garage-realm
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/garage-realm

logging:
  level:
    com.vagcv.garage: INFO

databaseChangeLog:
  - changeSet:
      id: 004-create-repair-reminders
      author: vagcv
      changes:
        - createTable:
            tableName: repair_reminders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: vehicle_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_repair_reminders_vehicle
                    references: vehicles(id)
                    deleteCascade: true
              - column:
                  name: reminder_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: days_in_repair
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        # ІДЕМПОТЕНТНІСТЬ на рівні БД: одне нагадування на авто на день, навіть якщо job запустили двічі
        - addUniqueConstraint:
            tableName: repair_reminders
            columnNames: vehicle_id, reminder_date
            constraintName: uk_repair_reminders_vehicle_day

  - changeSet:
      id: 004-create-fleet-snapshots
      author: vagcv
      changes:
        - createTable:
            tableName: fleet_snapshots
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: snapshot_date
                  type: DATE
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_fleet_snapshots_date
              - column:
                  name: total_vehicles
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: in_repair
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: ready_for_sale
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: sold
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: expected_profit
                  type: "NUMERIC(14,2)"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

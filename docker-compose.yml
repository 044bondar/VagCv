# Інфраструктура для локальної розробки: PostgreSQL + Keycloak
services:
  postgres:
    image: postgres:16-alpine
    container_name: vagcv-postgres
    environment:
      POSTGRES_DB: garage
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage
    ports:
      - "5433:5432"
    volumes:
      - vagcv-pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: vagcv-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/garage-realm.json:/opt/keycloak/data/import/garage-realm.json:ro

volumes:
  vagcv-pgdata:
